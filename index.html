<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#6d4d8b" />
<title>Haka!</title>
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="splash" class="splash" aria-hidden="false">
  <div class="splash-eagle">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="Haka eagle logo" role="img">
      <g fill="#26292d">
        <path d="M100 92 C 72 78 50 78 28 88 C 44 84 60 84 72 88 C 50 88 30 96 14 110 C 36 102 54 102 70 104 C 50 106 32 116 20 130 C 42 120 60 118 76 118 C 60 124 46 134 38 146 C 58 138 76 134 92 130 L 100 110 Z"/>
        <path d="M100 92 C 128 78 150 78 172 88 C 156 84 140 84 128 88 C 150 88 170 96 186 110 C 164 102 146 102 130 104 C 150 106 168 116 180 130 C 158 120 140 118 124 118 C 140 124 154 134 162 146 C 142 138 124 134 108 130 L 100 110 Z"/>
        <path d="M100 70 C 88 70 84 80 86 96 L 88 124 C 88 140 96 152 100 156 C 104 152 112 140 112 124 L 114 96 C 116 80 112 70 100 70 Z"/>
      </g>
      <path d="M100 72 C 88 70 84 60 90 50 C 94 42 100 38 100 38 C 100 38 106 42 110 50 C 116 60 112 70 100 72 Z" fill="#f4eee2"/>
      <path d="M98 56 L106 58 L102 66 Q100 68 98 66 Z" fill="#f0b836"/>
      <circle cx="104" cy="52" r="1.4" fill="#26292d"/>
    </svg>
  </div>
  <div class="splash-word">Haka!</div>
  <div class="splash-credit">© by JUFL</div>
</div>

<div id="phone" class="phone">
  <div id="statusbar" class="statusbar">
    <span class="sb-carrier">TIM</span>
    <span class="sb-wifi">●</span>
    <span class="sb-clock"></span>
    <span class="sb-arrow">↗</span>
    <span class="sb-batt"></span>
  </div>

  <main id="view" class="view"></main>

  <nav id="dock" class="dock" hidden>
    <button data-go="home" title="Home">◆</button>
    <button data-go="battle" title="Battle">⚔</button>
    <button data-go="stats" title="Stats">📈</button>
    <button data-go="attributes" title="Attributes">⚙</button>
    <button data-go="roster" title="Roster">★</button>
  </nav>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
