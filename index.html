<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#9aa9a4" />
<title>Haka!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239ec0b6'/%3E%3Ctext x='32' y='42' font-family='sans-serif' font-size='34' font-weight='200' text-anchor='middle' fill='white'%3EH%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="phone" class="phone">
  <div id="statusbar" class="statusbar">
    <span class="sb-carrier">TIM</span>
    <span class="sb-wifi">●</span>
    <span class="sb-clock"></span>
    <span class="sb-arrow">↗</span>
    <span class="sb-batt"></span>
  </div>

  <main id="view" class="view"></main>

  <nav id="dock" class="dock" hidden>
    <button data-go="home" title="Home">◆</button>
    <button data-go="battle" title="Battle">⚔</button>
    <button data-go="stats" title="Stats">📈</button>
    <button data-go="attributes" title="Attributes">⚙</button>
    <button data-go="roster" title="Roster">★</button>
  </nav>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
